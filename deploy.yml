name: Pipeline CAC 40 et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 2 * *"   # recalcul le 2 de chaque mois

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy scipy statsmodels arch
      - run: python pipeline.py
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html app.js style.css data.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
